name: Apple launch diagnostic (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Valley Estates status from Apple
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: node scripts/apple-launch-status.mjs
      - name: Keep non-secret diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-launch-status
          path: apple-launch-status.json
          if-no-files-found: warn
          retention-days: 7
