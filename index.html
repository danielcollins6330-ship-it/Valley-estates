<script>
"use strict";
// ===================== CONFIG =====================
const N=64, TS=32, SAVE_KEY='valleyEstatesV4';
const T={GRASS:0,FOREST:1,ROCK:2,WATER:3,HILL:4,BERRY:5};
const RES_OF={1:'wood',2:'stone',5:'food'};
const AGES=[
 {n:'Homestead Age',e:'🏡'},
 {n:'Settler Age',e:'🐎',cost:{food:250,wood:120},time:25},
 {n:'Estate Age',e:'🍷',cost:{food:450,wood:300,stone:150,wine:8},time:35},
 {n:'Valley Empire Age',e:'👑',cost:{food:700,stone:350,coins:500,wine:20},time:45}];
const B={
 homestead:{n:'Homestead',e:'🏠',w:3,h:3,cost:{wood:200,stone:100},age:9,drop:['food','wood','stone','grapes','wool'],pop:5,bt:60,col:'#b5562f',desc:'Town centre. Trains farmhands, researches Ages.'},
 house:{n:'Cottage',e:'🛖',w:2,h:2,cost:{wood:30},age:0,pop:5,bt:12,col:'#c2733e',desc:'+5 population.'},
 barn:{n:'Barn',e:'🏚️',w:2,h:2,cost:{wood:60},age:0,drop:['food','grapes','wool'],bt:18,col:'#a52d2d',desc:'Drop-off for food, grapes & wool. Farm techs.'},
 field:{n:'Wheat Field',e:'🌾',w:2,h:2,cost:{wood:40},age:0,pass:1,bt:10,col:'#8a5a2b',desc:'Farmhands harvest 150 food. Replant when empty.'},
 lumber:{n:'Lumber Camp',e:'🪓',w:2,h:2,cost:{wood:60},age:0,drop:['wood'],bt:15,col:'#7b5532',desc:'Wood drop-off. Axe techs.'},
 quarry:{n:'Quarry & Mill',e:'⛏️',w:2,h:2,cost:{wood:80},age:1,drop:['stone'],bt:18,col:'#777',desc:'Stone drop-off. Pick techs.'},
 vineyard:{n:'Vineyard',e:'🍇',w:2,h:2,cost:{wood:60,stone:20},age:1,pass:1,bt:14,col:'#5a7a2f',desc:'Grapevines regrow. Grapes → Winery.'},
 winery:{n:'Winery',e:'🍷',w:3,h:3,cost:{wood:120,stone:60},age:1,drop:['grapes'],bt:30,col:'#6b2142',desc:'Turns 4 grapes into 1 bottle of wine.'},
 paddock:{n:'Paddock',e:'🐄',w:3,h:3,cost:{wood:80},age:1,pass:1,bt:15,col:'#6d8b3a',desc:'Speckle Park cattle (beef) or Babydoll sheep (wool).'},
 dam:{n:'Farm Dam',e:'💧',w:2,h:2,cost:{stone:80},age:1,bt:20,col:'#3a7bbf',desc:'Halves drought losses. Must be near water.'},
 market:{n:'Market',e:'⚖️',w:3,h:3,cost:{wood:150,stone:50},age:2,bt:30,col:'#c99a2e',desc:'Trade resources for coins. Sell wine & wool.'}};
const TECH={
 axes:{n:'Sharp Axes',at:'lumber',age:0,cost:{food:60,wood:40},time:15,desc:'+40% wood gathering'},
 wheel:{n:'Wheelbarrows',at:'homestead',age:1,cost:{food:120,wood:60},time:20,desc:'+6 carry capacity, +15% speed'},
 plough:{n:'Better Ploughs',at:'barn',age:1,cost:{food:80,wood:80},time:18,desc:'+50% field harvest rate'},
 picks:{n:'Steel Picks',at:'quarry',age:1,cost:{food:80,wood:60},time:18,desc:'+40% stone gathering'},
 fence:{n:'Fox-proof Fencing',at:'paddock',age:1,cost:{wood:100},time:18,desc:'Foxes can no longer take sheep'},
 irrig:{n:'Irrigation',at:'dam',age:1,cost:{wood:80,stone:60},time:22,desc:'Fields & vines immune to drought'},
 drill:{n:'Seed Drill',at:'barn',age:2,cost:{food:150,wood:150},time:25,desc:'Fields replant automatically'},
 barrels:{n:'French Oak Barrels',at:'winery',age:2,cost:{wood:200,coins:50},time:25,desc:'Wine made 70% faster'},
 frostfan:{n:'Frost Fans',at:'winery',age:2,cost:{stone:120,coins:60},time:22,desc:'Vines protected from frost'},
 firebreak:{n:'Firebreaks',at:'lumber',age:2,cost:{food:100,wood:100},time:20,desc:'Bushfires burn out quickly'},
 cellar:{n:'Cellar Door Tourism',at:'market',age:2,cost:{food:200,coins:100,wine:5},time:30,desc:'Tourists: +1 coin/s per Winery'},
 breed:{n:'Selective Breeding',at:'paddock',age:2,cost:{food:200,coins:80},time:25,desc:'Paddocks produce 60% more'}};
const MISSIONS=[
 {t:'Select a farmhand',h:'Tap one of your farmhands (the little figures in straw hats) near the Homestead.',c:g=>g.sel.length>0},
 {t:'Gather wood',h:'With a farmhand selected, tap a 🌳 forest tile. They chop and carry wood back to the Homestead.',c:g=>g.stats.wood>=10},
 {t:'Train a farmhand',h:'Tap the Homestead, then press “Train Farmhand” (50 food).',c:g=>g.stats.trained>=1},
 {t:'Build a Cottage',h:'Tap 🔨, choose Cottage, tap the map to place the ghost, then ✔ Confirm.',c:g=>has(g,'house')},
 {t:'Build a Wheat Field',h:'Fields give steady food. Farmhands farm them automatically after building.',c:g=>has(g,'field')},
 {t:'Build a Barn',h:'Barns are food drop-offs — put one near fields & berry bushes.',c:g=>has(g,'barn')},
 {t:'Gather stone',h:'Send a farmhand to the grey 🪨 rocks.',c:g=>g.stats.stone>=10},
 {t:'Advance to Settler Age',h:'Tap the Homestead and research the Settler Age (250 food, 120 wood).',c:g=>g.age>=1},
 {t:'Plant a Vineyard',h:'Grapes are the Ferguson Valley speciality.',c:g=>has(g,'vineyard')},
 {t:'Build a Winery',h:'Deliver grapes to a Winery to bottle wine.',c:g=>has(g,'winery')},
 {t:'Stock a Paddock',h:'Build a Paddock, then buy Speckle Park cattle or Babydoll sheep.',c:g=>g.buildings.some(b=>b.type==='paddock'&&b.count>0)},
 {t:'Bottle 8 wines',h:'Keep farmhands on vineyards. Each winery bottles 4 grapes → 1 wine.',c:g=>g.stats.wine>=8},
 {t:'Advance to Estate Age',h:'Unlocks the Market and advanced techs.',c:g=>g.age>=2},
 {t:'Build a Market',h:'Sell wine and wool for coins.',c:g=>has(g,'market')},
 {t:'Earn 500 coins',h:'Sell wine at the Market. Cellar Door Tourism helps!',c:g=>g.stats.coins>=500},
 {t:'Advance to Valley Empire Age',h:'The final age.',c:g=>g.age>=3},
 {t:'WIN: Bottle 60 wines',h:'Become the top estate in Ferguson Valley!',c:g=>g.stats.wine>=60&&g.age>=3}];
const SEASONS=[{n:'Spring',e:'🌸'},{n:'Summer',e:'☀️'},{n:'Autumn',e:'🍂'},{n:'Winter',e:'❄️'}];
const SEASON_LEN=120;
function has(g,t){return g.buildings.some(b=>b.type===t&&b.built)}
const RICON={food:'🌾',wood:'🪵',stone:'🪨',coins:'🪙',grapes:'🍇',wine:'🍷',wool:'🧶'};

// ===================== STATE =====================
let G; let uid=1;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noiseGen(r){const g=[];const S=9;for(let i=0;i<S*S;i++)g.push(r());
 return (x,y,sc)=>{x/=sc;y/=sc;const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const v=(a,b)=>g[((a%S+S)%S)+((b%S+S)%S)*S];const s=t=>t*t*(3-2*t);
  const a=v(xi,yi),b=v(xi+1,yi),c=v(xi,yi+1),d=v(xi+1,yi+1);return a+(b-a)*s(xf)+(c-a)*s(yf)+(a-b-c+d)*s(xf)*s(yf)}}
function newGame(seed){
 seed=seed||(Math.random()*1e9|0);const r=rng(seed);
 const n1=noiseGen(r),n2=noiseGen(r),n3=noiseGen(r);
 const ter=new Uint8Array(N*N),amt=new Int16Array(N*N),var_=new Uint8Array(N*N);
 const rx=y=>Math.round(N*0.22+Math.sin(y/7)*4+Math.sin(y/3.1)*1.5);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;var_[i]=r()*255|0;
  const f=n1(x,y,7)*0.7+n1(x*2,y*2,7)*0.3,h=n2(x,y,10),k=n3(x,y,4);
  let t=T.GRASS;if(h>0.66)t=T.HILL;if(f>0.6)t=T.FOREST;if(k>0.8&&h>0.35)t=T.ROCK;if(r()<0.008)t=T.BERRY;
  const rv=rx(y);if(x>=rv&&x<rv+2&&!(y%16===8||y%16===9))t=T.WATER;
  if(Math.hypot(x-50,y-14)<3.2)t=T.WATER; // lake/dam
  ter[i]=t;}
 const cx=38,cy=34;
 for(let y=cy-6;y<=cy+7;y++)for(let x=cx-6;x<=cx+7;x++)if(ter[y*N+x]!==T.WATER)ter[y*N+x]=T.GRASS;
 const patch=(px,py,w,h,t,p)=>{for(let y=py;y<py+h;y++)for(let x=px;x<px+w;x++)if(r()<p)ter[y*N+x]=t};
 patch(cx-7,cy-9,7,4,T.FOREST,.85);patch(cx+6,cy+3,3,6,T.FOREST,.8);
 patch(cx+5,cy-5,3,2,T.BERRY,.9);patch(cx-5,cy+6,3,2,T.ROCK,1);
 for(let i=0;i<N*N;i++)amt[i]=ter[i]===T.FOREST?100:ter[i]===T.ROCK?200:ter[i]===T.BERRY?100:0;
 G={seed,ter,amt,var:var_,explored:new Uint8Array(N*N),res:{food:200,wood:200,stone:60,coins:0,grapes:0,wine:0,wool:0},
  units:[],buildings:[],time:0,age:0,techs:{},research:null,mission:0,stats:{wood:0,stone:0,food:0,trained:0,wine:0,coins:0},
  season:0,events:{},sel:[],selB:null,won:false,tutorialSeen:false,nextEvt:40};
 uid=1;
 const tc=addBuilding('homestead',cx,cy,true);
 for(let i=0;i<3;i++)spawnUnit(cx+1+i*0.9-0.4,cy+3.4);
 cam.zoom=1.25;centerOn(cx+1.5,cy+1.5);
 revealAll();
 renderMap();renderFog();
}
function addBuilding(type,x,y,built){const d=B[type];const b={id:uid++,type,x,y,w:d.w,h:d.h,built:!!built,prog:built?1:0,queue:[],research:null,stock:0,food:type==='field'?150:0,grapes:type==='vineyard'?60:0,count:0,kind:null,pt:0,wt:0};
 G.buildings.push(b);markOcc();return b}
function spawnUnit(x,y){const u={id:uid++,x,y,path:null,task:null,phase:null,carry:0,ct:null,wt:0,dir:1,anim:Math.random()*6};G.units.push(u);return u}

// ===================== GRID / PATHFINDING =====================
let occ=new Int32Array(N*N);
function markOcc(){occ.fill(0);for(const b of G.buildings)for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)occ[y*N+x]=b.id}
function inb(x,y){return x>=0&&y>=0&&x<N&&y<N}
function bAt(x,y){if(!inb(x,y))return null;const id=occ[y*N+x];return id?G.buildings.find(b=>b.id===id):null}
function passable(x,y){if(!inb(x,y))return false;const t=G.ter[y*N+x];if(t===T.FOREST||t===T.ROCK||t===T.WATER||t===T.BERRY)return false;const b=bAt(x,y);if(b&&!B[b.type].pass)return false;return true}
function astar(sx,sy,rect){// rect {x,y,w,h} goal: tile within or adjacent(8) to rect & passable
 const isGoal=(x,y)=>x>=rect.x-1&&x<=rect.x+rect.w&&y>=rect.y-1&&y<=rect.y+rect.h&&passable(x,y)&&(rect.inside||!(x>=rect.x&&x<rect.x+rect.w&&y>=rect.y&&y<rect.y+rect.h)||B_pass(x,y));
 const tx=rect.x+(rect.w-1)/2,ty=rect.y+(rect.h-1)/2;
 if(isGoal(sx,sy))return[];
 const g=new Float32Array(N*N).fill(1e9),from=new Int32Array(N*N).fill(-1),closed=new Uint8Array(N*N);
 const heap=[];const push=(i,f)=>{heap.push([f,i]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p}};
 const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){let l=2*k+1,r=l+1,m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m}}return top};
 const s=sy*N+sx;g[s]=0;push(s,0);let n=0;
 while(heap.length&&n++<6000){const[,i]=pop();if(closed[i])continue;closed[i]=1;const x=i%N,y=(i/N)|0;
  if(isGoal(x,y)){const p=[];let c=i;while(c!==s){p.push([c%N,(c/N)|0]);c=from[c]}return p.reverse()}
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(!passable(nx,ny))continue;
   if(dx&&dy&&(!passable(x+dx,y)||!passable(x,y+dy)))continue;const j=ny*N+nx;if(closed[j])continue;
   const ng=g[i]+(dx&&dy?1.414:1)+(G.ter[j]===T.HILL?0.6:0);if(ng<g[j]){g[j]=ng;from[j]=i;push(j,ng+Math.hypot(nx-tx,ny-ty))}}}
 return null}
function B_pass(x,y){const b=bAt(x,y);return b&&B[b.type].pass}
function pathTo(u,rect){let sx=Math.floor(u.x),sy=Math.floor(u.y);
 if(!passable(sx,sy)){// nudge out
  let best=null,bd=1e9;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(passable(sx+dx,sy+dy)){const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=[sx+dx,sy+dy]}}
  if(best){u.x=best[0]+.5;u.y=best[1]+.5;sx=best[0];sy=best[1]}}
 const p=astar(sx,sy,rect);u.path=p?p.map(([x,y])=>[x+.5,y+.5]):null;return !!p}

// ===================== TASKS =====================
const rectTile=(x,y)=>({x,y,w:1,h:1});
const rectB=b=>({x:b.x,y:b.y,w:b.w,h:b.h,inside:!!B[b.type].pass});
function cap(){return 10+(G.techs.wheel?6:0)}
function command(units,tx,ty){if(!units.length)return;const b=bAt(tx,ty);const t=inb(tx,ty)?G.ter[ty*N+tx]:-1;
 let label='';
 units.forEach((u,k)=>{
  if(b){if(!b.built)setTask(u,{type:'build',bid:b.id}),label='Build';
   else if(b.type==='field')setTask(u,{type:'farm',bid:b.id,res:'food'}),label='Farm';
   else if(b.type==='vineyard')setTask(u,{type:'farm',bid:b.id,res:'grapes'}),label='Tend vines';
   else if(b.type==='paddock')setTask(u,{type:'farm',bid:b.id,res:b.kind==='sheep'?'wool':'food'}),label='Tend stock';
   else if(B[b.type].drop&&u.carry>0){u.task={type:'deposit'};u.phase='return';pathTo(u,rectB(b));label='Drop off'}
   else moveTo(u,tx,ty,k),label='Move';}
  else if(RES_OF[t]){setTask(u,{type:'gather',tx,ty,res:RES_OF[t]});label={wood:'Chop',stone:'Mine',food:'Forage'}[RES_OF[t]]}
  else moveTo(u,tx,ty,k),label='Move';});
 G.ping={x:tx+.5,y:ty+.5,t:1,l:label}}

function rate(res,src){let r=0.9;if(res==='wood'&&G.techs.axes)r*=1.4;if(res==='stone'&&G.techs.picks)r*=1.4;

  if(t.type==='gather'){const i=t.ty*N+t.tx;if(G.ter[i]!==({wood:T.FOREST,stone:T.ROCK,food:T.BERRY})[t.res]){const nn=findNear(t.tx,t.ty,({wood:T.FOREST,stone:T.ROCK,food:T.BERRY})[t.res],8);

function popCap(){return Math.min(80,G.buildings.reduce((s,b)=>s+(b.built&&B[b.type].pop||0),0))}
function canAfford(c){return Object.entries(c||{}).every(([k,v])=>G.res[k]>=v)}
function pay(c){if(!canAfford(c))return false;for(const k in c)G.res[k]-=c[k];return true}
function costStr(c){return Object.entries(c||{}).map(([k,v])=>RICON[k]+v).join(' ')}
function tick(dt){G.time+=dt;
 for(const u of G.units)stepUnit(u,dt);
 for(const b of G.buildings){if(!b.built)continue;
  if(b.queue.length){b.qt=(b.qt||0)+dt;if(G.units.length>=popCap()){b.blocked=true}else{b.blocked=false;if(b.qt>=12){b.qt=0;b.queue.shift();const u=spawnUnit(b.x+b.w/2,b.y+b.h+.4);G.stats.trained++;toast('🧑‍🌾 New farmhand ready','good');
    if(b.rally)command([u],b.rally[0],b.rally[1])}}}
  if(b.research){b.research.t+=dt;if(b.research.t>=b.research.total){finishResearch(b.research.id);b.research=null}}
  if(b.type==='vineyard'&&G.season!==3)b.grapes=Math.min(80,b.grapes+dt*0.35);
  if(b.type==='paddock'&&b.count>0){b.pt+=dt;if(b.pt>=10){b.pt=0;b.stock=Math.min(200,b.stock+(b.kind==='cattle'?4:3)*b.count*(G.techs.breed?1.6:1))}}
  if(b.type==='winery'){b.wt+=dt;const need=G.techs.barrels?3.5:6;if(b.wt>=need){b.wt=0;if(G.res.grapes>=4){G.res.grapes-=4;G.res.wine++;G.stats.wine++;floatText(b.x+1.5,b.y,'+1🍷')}}
   if(G.techs.cellar){G.res.coins+=dt;G.stats.coins+=dt}}}
 // seasons & events
 const s=Math.floor(G.time/SEASON_LEN)%4;if(s!==G.season){G.season=s;seasonStart(s)}
 G.nextEvt-=dt;if(G.nextEvt<=0){G.nextEvt=50+Math.random()*40;randomEvent()}
 if(G.fire){G.fire.t-=dt;G.fire.spread-=dt;if(G.fire.spread<=0){G.fire.spread=G.techs.firebreak?3:1.4;spreadFire()}if(G.fire.t<=0||!G.fire.tiles.length){G.fire=null;toast('🔥 The bushfire has burnt out.')}}
 for(const k of ['drought','frost'])if(G.events[k]&&G.time>G.events[k])delete G.events[k];
 // missions
 while(G.mission<MISSIONS.length&&MISSIONS[G.mission].c(G)){G.mission++;if(G.mission<MISSIONS.length)toast('✅ Goal done! Next: '+MISSIONS[G.mission].t,'good');}
 if(G.mission>=MISSIONS.length&&!G.won){G.won=true;showWin()}
}
function seasonStart(s){toast(SEASONS[s].e+' '+SEASONS[s].n+' has arrived');
 if(s===2)G.buildings.forEach(b=>{if(b.type==='vineyard')b.grapes=80});if(s===2&&has(G,'vineyard'))toast('🍇 Vintage! Vineyards are full.','good')}
function randomEvent(){const s=G.season,r=Math.random();
 if(s===1&&r<0.5){G.events.drought=G.time+60;toast(G.techs.irrig?'☀️ Drought — irrigation keeps crops going.':'☀️ Drought! Field & vine yields reduced. Build a Dam / Irrigation.','warn');return}
 if(s===1&&r<0.85&&G.age>=1){startFire();return}
 if(s===3&&r<0.6){G.events.frost=G.time+40;if(G.techs.frostfan){toast('❄️ Frost — frost fans protect the vines.');return}let lost=0;G.buildings.forEach(b=>{if(b.type==='vineyard'){lost+=b.grapes*0.5|0;b.grapes*=0.5}if(b.type==='field'){b.food=Math.max(0,b.food-25)}});toast('❄️ Frost! Vines and fields damaged.','warn');return}

 if(r<0.3){G.res.coins+=40;G.stats.coins+=40;toast('🧺 Visitors from Bunbury bought produce: +40🪙','good')}}

 let best=null,bd=30;for(const u of G.units){const p=w2s(u.x,u.y,0.3);const d=Math.hypot(p[0]-sx,p[1]-sy);if(d<bd){bd=d;best=u}}

 if(G.sel.length){const b=bAt(tx,ty);command(selUnits(),tx,ty);return}
 const b=bAt(tx,ty);if(b){G.selB=b.id;G.sel=[];panelDirty=true;return}
 G.selB=null;panelDirty=true}
function selUnits(){return G.units.filter(u=>G.sel.includes(u.id))}
function boxSelect(bx){const x0=Math.min(bx.x0,bx.x1),x1=Math.max(bx.x0,bx.x1),y0=Math.min(bx.y0,bx.y1),y1=Math.max(bx.y0,bx.y1);
 G.sel=G.units.filter(u=>{const[sx,sy]=w2s(u.x,u.y);return sx>=x0&&sx<=x1&&sy>=y0&&sy<=y1}).map(u=>u.id);G.selB=null;panelDirty=true;toast(G.sel.length+' farmhands selected');setBox(false)}
function setBox(v){boxMode=v;document.getElementById('bBox').classList.toggle('on',v);if(v)toast('Drag on the map to select farmhands')}
function validPlace(type,x,y){const d=B[type];if(x<0||y<0||x+d.w>N||y+d.h>N)return false;let nearW=false;
 for(let j=y;j<y+d.h;j++)for(let i=x;i<x+d.w;i++){const k=j*N+i;if(!G.explored[k])return false;const t=G.ter[k];if(t!==T.GRASS&&t!==T.HILL)return false;if(occ[k])return false}
 if(type==='dam'){for(let j=y-2;j<y+d.h+2;j++)for(let i=x-2;i<x+d.w+2;i++)if(inb(i,j)&&G.ter[j*N+i]===T.WATER)nearW=true;if(!nearW)return false}
 return true}
function confirmPlace(){const p=placing;if(!p||p.x==null)return;if(!validPlace(p.type,p.x,p.y)){toast('Can\'t build there','warn');return}
 if(!pay(B[p.type].cost)){toast('Not enough resources','warn');return}
 const b=addBuilding(p.type,p.x,p.y,false);
 let builders=selUnits();if(!builders.length){const idle=G.units.filter(u=>!u.task).sort((a,c)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(c.x-p.x,c.y-p.y));builders=idle.slice(0,1);if(!builders.length){const any=G.units.slice().sort((a,c)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(c.x-p.x,c.y-p.y));builders=any.slice(0,1)}}
 builders.forEach(u=>setTask(u,{type:'build',bid:b.id}));
 // move units standing in non-passable footprint
 if(!B[p.type].pass)for(const u of G.units)if(u.x>=b.x&&u.x<b.x+b.w&&u.y>=b.y&&u.y<b.y+b.h){u.y=b.y+b.h+.5;if(u.task)setTask(u,u.task)}
 toast(B[p.type].e+' Foundation placed — '+builders.length+' builder(s) on the way');placing=null;panelDirty=true;return b}

// ===================== UI =====================
const $=id=>document.getElementById(id);
let panelDirty=true,lastPanel='';
function toast(t,c){const d=document.createElement('div');d.className='toast '+(c||'');d.textContent=t;const box=$('toasts');box.prepend(d);while(box.children.length>4)box.lastChild.remove();setTimeout(()=>d.remove(),4000)}
function btn(act,label,sub,cls,dis){return `<button class="btn ${cls||''} ${dis?'dis':''}" data-act="${act}">${label}${sub?`<small>${sub}</small>`:''}</button>`}
function updateBar(){const r=G.res;$('rF').textContent='🌾'+(r.food|0);$('rW').textContent='🪵'+(r.wood|0);$('rS').textContent='🪨'+(r.stone|0);$('rC').textContent='🪙'+(r.coins|0);$('rG').textContent='🍇'+(r.grapes|0);$('rV').textContent='🍷'+(r.wine|0);$('rP').textContent='👤'+G.units.length+'/'+popCap();
 $('ageL').textContent=AGES[G.age].e+' '+AGES[G.age].n;const yr=Math.floor(G.time/SEASON_LEN/4)+1,sp=(G.time%SEASON_LEN)/SEASON_LEN;
 $('seasonL').textContent=SEASONS[G.season].e+' '+SEASONS[G.season].n+' '+Math.round(sp*100)+'% · Yr '+yr+' '+(isNight()?'🌙':'☀️')+(G.events.drought?' · ☀️Drought':'')+(G.events.frost?' · ❄️Frost':'')+(G.fire?' · 🔥Fire':'')+(speed===0?' · ⏸ PAUSED':'');
 const idle=G.units.filter(u=>!u.task&&!u.moving).length;$('idleN').textContent=idle;$('idleN').style.display=idle?'':'none';
 const m=MISSIONS[Math.min(G.mission,MISSIONS.length-1)];$('goal').innerHTML=`<b>🎯 Goal ${Math.min(G.mission+1,MISSIONS.length)}/${MISSIONS.length}:</b> ${G.won?'🏆 You won!':m.t}<div class="hint">${G.won?'':m.h}</div>`;$('goal').classList.toggle('min',G.mission>=7&&!goalOpen)}
let goalOpen=false;$('goal').addEventListener('pointerdown',()=>{goalOpen=!goalOpen;updateBar()});
function panelHTML(){
 if(placing){const d=B[placing.type],ok=placing.x!=null&&validPlace(placing.type,placing.x,placing.y);
  return `<h4>${d.e} Place ${d.n}</h4><div class="d">${placing.x==null?'Tap the map where you want it.':ok?'Looks good! Confirm to lay the foundation.':'❌ Invalid spot: needs explored, clear grass'+(placing.type==='dam'?' next to water':'')+'.'} Cost ${costStr(d.cost)}</div><div class="btns">${btn('confirm','✔ Confirm','',ok?'':'dis')}${btn('cancel','✖ Cancel','','red')}</div>`}
 const us=selUnits();
 if(us.length){const u=us[0];const st=us.length>1?us.length+' farmhands selected':(u.task?({gather:'Gathering '+u.task.res,build:'Building',farm:'Working '+(u.task.res==='grapes'?'vines':u.task.res==='wool'?'sheep':'farm'),move:'Walking',deposit:'Dropping off'}[u.task.type]+(u.phase==='return'?' (carrying '+u.carry+RICON[u.ct]+' home)':'')):'Idle 💤');
  return `<h4>🧑‍🌾 ${us.length>1?'Farmhands ×'+us.length:'Farmhand'}</h4><div class="d">${st}. Tap trees 🌳, rocks 🪨, berries 🫐 or a building to give orders. Carry cap ${cap()}.</div><div class="btns">${btn('build','🔨 Build','')}${btn('deselect','✖ Deselect','','alt')}${btn('stop','⏹ Stop','','red')}</div>`}
 const b=G.buildings.find(b=>b.id===G.selB);
 if(b){const d=B[b.type];let h=`<h4>${d.e} ${d.n}${b.built?'':' (under construction '+Math.round(b.prog*100)+'%)'}</h4><div class="d">${d.desc}`;
  if(b.type==='field')h+=` 🌾 ${b.food|0}/150 food left.`;if(b.type==='vineyard')h+=` 🍇 ${b.grapes|0}/80 grapes.`;if(b.type==='paddock')h+=b.kind?` ${b.count} ${b.kind==='cattle'?'Speckle Park 🐄':'Babydoll 🐑'} · stock ${b.stock|0}${b.kind==='cattle'?'🥩':'🧶'}`:' Empty.';
  if(b.type==='winery')h+=` 🍇 ${G.res.grapes|0} waiting · bottled ${G.stats.wine}.`;h+='</div>';
  if(b.research){const r=b.research;h+=`<div class="d">🔬 ${r.id.startsWith('age')?AGES[+r.id.slice(3)].n:TECH[r.id].n} ${Math.round(r.t/r.total*100)}%</div><div class="pb"><i style="width:${r.t/r.total*100}%"></i></div>`}
  if(b.queue.length)h+=`<div class="d">Training ${b.queue.length} farmhand(s)${b.blocked?' — ⚠️ need more Cottages':''}</div><div class="pb"><i style="width:${(b.qt||0)/12*100}%"></i></div>`;
  h+='<div class="btns">';
  if(!b.built){h+=btn('deselect','✖ Close','','alt')+'</div>';return h}
  if(b.type==='homestead'){h+=btn('train','🧑‍🌾 Train Farmhand','🌾50 · 12s','',!canAfford({food:50})||b.queue.length>=5);
   if(G.age<3&&!b.research){const a=AGES[G.age+1];h+=btn('age','⬆️ '+a.n,costStr(a.cost)+' · '+a.time+'s','alt',!canAfford(a.cost))}}
  if(b.type==='field'&&b.food<1)h+=btn('replant','🌱 Replant','🪵30','',!canAfford({wood:30}));
  if(b.type==='paddock'){if(!b.kind){h+=btn('cattle','🐄 Speckle Park ×2','🌾120','',!canAfford({food:120}))+btn('sheep','🐑 Babydoll ×2','🌾80','',!canAfford({food:80}))}
   else h+=btn('breed','❤️ Breed +1',b.kind==='cattle'?'🌾60':'🌾40','',b.count>=8||!canAfford({food:b.kind==='cattle'?60:40}))}
  if(b.type==='market'){h+=btn('sell:wine:1:35','🍷 Sell 1 wine','+35🪙','',G.res.wine<1)+btn('sell:wool:10:30','🧶 Sell 10 wool','+30🪙','',G.res.wool<10)+btn('sell:food:100:30','Sell 100🌾','+30🪙','',G.res.food<100)+btn('sell:wood:100:30','Sell 100🪵','+30🪙','',G.res.wood<100)+btn('sell:stone:100:45','Sell 100🪨','+45🪙','',G.res.stone<100)+btn('buy:food:100:60','Buy 100🌾','-60🪙','alt',G.res.coins<60)+btn('buy:stone:100:80','Buy 100🪨','-80🪙','alt',G.res.coins<80)}
  if(!b.research)for(const[id,tc]of Object.entries(TECH)){if(tc.at!==b.type||G.techs[id])continue;const lock=G.age<tc.age;
   h+=btn('tech:'+id,'🔬 '+tc.n,lock?'🔒 '+AGES[tc.age].n:costStr(tc.cost)+' · '+tc.desc,'alt',lock||!canAfford(tc.cost))}
  if(b.type==='paddock'&&b.kind==='sheep'&&G.res.wool)h+='';
  h+=btn('deselect','✖ Close','','red')+'</div>';return h}
 return `<h4>🍇 Valley Estates</h4><div class="d">Ferguson Valley, WA. Drag to pan, pinch to zoom. Tap a farmhand then tap where to work. Tap 🔨 to build. Seasons bring drought, frost, foxes and bushfires!</div><div class="btns">${btn('build','🔨 Build','')}${btn('selidle','👥 Select idle','')}${btn('tc','🏠 Homestead','','alt')}</div>`}
function renderPanel(){const h=panelHTML();if(h!==lastPanel){$('panel').innerHTML=h;lastPanel=h}}
$('panel').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-act]');if(!el||el.classList.contains('dis'))return;e.preventDefault();act(el.dataset.act)});
function act(a){const b=G.buildings.find(b=>b.id===G.selB);const p=a.split(':');
 switch(p[0]){
 case'build':openBuild();break;case'deselect':G.sel=[];G.selB=null;break;
 case'stop':selUnits().forEach(u=>{u.task=null;u.path=null});break;
 case'confirm':confirmPlace();break;case'cancel':placing=null;break;
 case'selidle':selectIdle();break;case'tc':{const t=G.buildings.find(b=>b.type==='homestead');if(t){G.selB=t.id;centerOn(t.x+1.5,t.y+1.5)}break}
 case'train':if(b&&b.queue.length<5&&pay({food:50}))b.queue.push(1);break;
 case'age':{const a2=AGES[G.age+1];if(b&&!b.research&&pay(a2.cost)){b.research={id:'age'+(G.age+1),t:0,total:a2.time};toast('⬆️ Researching '+a2.n)}break}
 case'tech':{const tc=TECH[p[1]];if(b&&!b.research&&G.age>=tc.age&&pay(tc.cost)){b.research={id:p[1],t:0,total:tc.time}}break}
 case'replant':if(b&&pay({wood:30})){b.food=150;b.burnt=0}break;
 case'cattle':case'sheep':if(b&&pay({food:p[0]==='cattle'?120:80})){b.kind=p[0];b.count=2;toast(p[0]==='cattle'?'🐄 Speckle Park cattle arrived':'🐑 Babydoll sheep arrived','good')}break;
 case'breed':if(b&&b.count<8&&pay({food:b.kind==='cattle'?60:40}))b.count++;break;
 case'sell':if(G.res[p[1]]>=+p[2]){G.res[p[1]]-=+p[2];G.res.coins+=+p[3];G.stats.coins+=+p[3]}break;
 case'buy':if(G.res.coins>=+p[3]){G.res.coins-=+p[3];G.res[p[1]]+=+p[2]}break;
 }panelDirty=true;lastPanel='';renderPanel();updateBar()}
function openBuild(){let h='<h3>🔨 Build</h3><div class="grid">';
 for(const[k,d]of Object.entries(B)){if(d.age>3)continue;const lock=G.age<d.age,poor=!canAfford(d.cost);
  h+=`<div class="card ${lock?'lock':''} ${poor?'poor':''}" data-b="${k}"><b>${d.e}</b>${d.n}<br>${lock?'🔒 '+AGES[d.age].n:costStr(d.cost)}</div>`}
 h+='</div><button class="close" data-b="x">Close</button>';$('sheet').innerHTML=h;$('modal').style.display='flex'}
$('sheet').addEventListener('click',e=>{const c=e.target.closest('[data-b]');if(!c)return;const k=c.dataset.b;
 if(k==='x'||k==='newgame-no'){closeModal();return}if(k==='newgame-yes'){localStorage.removeItem(SAVE_KEY);newGame();closeModal();toast('🌱 New estate founded!');return}
 if(k==='resume'){closeModal();return}if(k.startsWith('q-')){VE3D.setQuality(k.slice(2));toast('Graphics: '+k.slice(2));closeModal();return}
 if(!B[k])return;const d=B[k];if(G.age<d.age){toast('Requires '+AGES[d.age].n,'warn');return}if(!canAfford(d.cost)){toast('Need '+costStr(d.cost),'warn');return}
 const [cx,cy]=s2w(W/2,(H-140)/2);placing={type:k,x:Math.floor(cx-d.w/2),y:Math.floor(cy-d.h/2)};closeModal();panelDirty=true;toast('Tap the map to move the ghost, then ✔ Confirm')});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function closeModal(){$('modal').style.display='none'}
function selectIdle(){const idle=G.units.filter(u=>!u.task);G.sel=idle.map(u=>u.id);G.selB=null;toast(idle.length?idle.length+' idle farmhands selected':'No idle farmhands');panelDirty=true}
let idleIdx=0;$('bIdle').onclick=()=>{const idle=G.units.filter(u=>!u.task);if(!idle.length){toast('Everyone is busy 👍');return}const u=idle[idleIdx++%idle.length];G.sel=[u.id];G.selB=null;centerOn(u.x,u.y);panelDirty=true};
$('bAllIdle').onclick=selectIdle;$('bBox').onclick=()=>setBox(!boxMode);$('bBuild').onclick=openBuild;
let speed=1,lastSpeed=1;$('bPause').onclick=()=>{if(speed){lastSpeed=speed;speed=0;$('bPause').textContent='▶️'}else{speed=lastSpeed;$('bPause').textContent='⏸'}updateBar()};
$('bSpeed').onclick=()=>{const s=[1,2,3];const cur=speed||lastSpeed;const n=s[(s.indexOf(cur)+1)%3];if(speed)speed=n;lastSpeed=n;$('bSpeed').textContent=n+'×'};
$('bMenu').onclick=()=>{$('sheet').innerHTML=`<h3>☰ Menu</h3><p>Estate seed ${G.seed}. Autosaves every 10 s on this device only.</p><p>No account and no data collected. <a href="privacy.html" style="color:#7a3d0c">Privacy policy</a></p><p><b>How to play:</b> Gather 🌾🪵🪨, build Cottages for population, Fields & Vineyards for food and grapes, bottle 🍷 at the Winery and sell it at the Market. Advance through 4 Ages. Survive drought, frost, foxes and bushfires. Win by reaching the Valley Empire Age with 60 bottles made.</p><p><b>Graphics</b> (current: ${['Low','Medium','High'][VE3D.quality]})</p><div class="btns" style="margin-bottom:10px"><button class="btn" data-b="q-auto">Auto</button><button class="btn" data-b="q-high">High</button><button class="btn" data-b="q-med">Medium</button><button class="btn" data-b="q-low">Low</button></div><button class="btn" data-b="resume" style="width:100%;margin-bottom:8px">▶ Resume</button><button class="btn red" data-b="newgame-yes" style="width:100%">🔄 New Game (erase save)</button><button class="close" data-b="x">Close</button>`;$('modal').style.display='flex'};
function showWin(){$('sheet').innerHTML=`<h3>🏆 Ferguson Valley's Top Estate!</h3><p>You reached the Valley Empire Age and bottled ${G.stats.wine} wines in ${Math.floor(G.time/60)} minutes. Keep playing or start a new estate.</p><button class="btn" data-b="resume" style="width:100%;margin-bottom:8px">Keep playing</button><button class="btn red" data-b="newgame-yes" style="width:100%">New Game</button>`;$('modal').style.display='flex'}
function showIntro(){$('sheet').innerHTML=`<h3>🍇 Welcome to Valley Estates</h3><p>Your little homestead sits in the Ferguson Valley, WA. Grow it into the region's top wine estate!</p><p>👆 <b>Tap</b> a farmhand, then tap a tree, rock, berry bush or building to work.<br>✋ <b>Drag</b> to pan · 🤏 <b>pinch</b> to zoom.<br>🔨 Build · 🧑‍🌾 find idle workers · ⬚ drag-select.</p><p>Follow the 🎯 goals at top-left.</p><button class="close" data-b="x">Let's farm!</button>`;$('modal').style.display='flex';G.tutorialSeen=true}

// ===================== SAVE =====================
function save(){try{const s={...G,ter:Array.from(G.ter),amt:Array.from(G.amt),var:Array.from(G.var),explored:Array.from(G.explored),units:G.units.map(u=>({...u,path:null,phase:u.task?'go':null})),uid,cam:{x:cam.x,y:cam.y,zoom:cam.zoom}};localStorage.setItem(SAVE_KEY,JSON.stringify(s))}catch(e){console.warn('save failed',e)}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s||!s.ter)return false;
 G={...s,ter:Uint8Array.from(s.ter),amt:Int16Array.from(s.amt),var:Uint8Array.from(s.var),explored:Uint8Array.from(s.explored)};uid=s.uid;Object.assign(cam,s.cam);markOcc();renderMap();renderFog();
 G.units.forEach(u=>{if(u.task)setTask(u,u.task)});return true}catch(e){console.warn('load failed',e);return false}}

// ===================== LOOP =====================
let last=performance.now(),acc=0,uiT=0,saveT=0,fogT=0;
function frame(now){const real=Math.min(0.1,(now-last)/1000);last=now;
 const dt=real*speed;if(dt>0){let r=dt;while(r>0){const s=Math.min(r,0.05);tick(s);r-=s}}
 floats.forEach(f=>{f.a-=real});floats=floats.filter(f=>f.a>0);if(G.ping){G.ping.t-=real*1.2;if(G.ping.t<=0)G.ping=null}
 fogT+=real;if(fogT>0.25){fogT=0;for(const u of G.units)revealAround(u.x,u.y,4.5)}
 uiT+=real;if(uiT>0.25||panelDirty){uiT=0;panelDirty=false;updateBar();renderPanel()}
 miniT+=real;if(miniT>0.5){miniT=0;drawMini()}
 saveT+=real;if(saveT>10){saveT=0;save()}
 draw();requestAnimationFrame(frame)}
addEventListener('resize',resize);addEventListener('visibilitychange',()=>{if(document.hidden)save()});
resize();if(!load())newGame();if(!G.tutorialSeen)showIntro();
requestAnimationFrame(frame);
// test hooks
window.VE={camCenter,unitScreen:u=>w2s(u.x,u.y,0.3),get G(){return G},tick,command,w2s,s2w,centerOn,cam,act,confirmPlace,setPlacing:(t,x,y)=>{placing={type:t,x,y};panelDirty=true},validPlace,B,save,findNear,T,N,popCap,setSpeed:v=>speed=v};
</script></body></html>
